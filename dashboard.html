<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control</title>

    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="custom.css">
</head>

<body>

    
    <nav class="navbar navbar-dark bg-primary px-3">
        <span class="navbar-brand mb-0 h1">Smart Control</span>

        <div class="d-flex gap-2">
            <button id="btnMenu" class="btn btn-light">
                ☰ Menu
            </button>

            <button id="btnTema" class="btn btn-dark">
                Dark Mode
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            
            <aside id="menuLateral" class="col-md-3 col-lg-2 sidebar">
                <h5>Menu</h5>

                <ul class="list-group">
                    <li class="list-group-item">Dashboard</li>
                    <li class="list-group-item">Dispositivos</li>
                    <li class="list-group-item">Configurações</li>
                </ul>
            </aside>

            
            <main class="col-md-9 col-lg-10 p-4">

                <h1>Dashboard</h1>

                
                <div class="mb-4">
                    <label for="campoBusca" class="form-label">
                        
                    </label>

                    <input
                        type="text"
                        id="campoBusca"
                        class="form-control"
                        placeholder="Digite para buscar..."
                    >
                </div>

                
                <div class="table-responsive">
                    <table id="tabelaDispositivos" class="table table-striped">
                        <thead>
                            <tr>
                                <th>Dispositivo</th>
                                <th>Tipo</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>Lâmpada Sala</td>
                                <td>Iluminação</td>
                                <td>Ligada</td>
                            </tr>

                            <tr>
                                <td>Ar Condicionado</td>
                                <td>Climatização</td>
                                <td>Desligado</td>
                            </tr>

                            <tr>
                                <td>Sensor de Temperatura</td>
                                <td>Sensor</td>
                                <td>Ativo</td>
                            </tr>

                            <tr>
                                <td>Câmera Entrada</td>
                                <td>Segurança</td>
                                <td>Ativa</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

               
                <div class="mt-4">
                    <button id="btnAccordion" class="btn btn-primary">
                        
                    </button>

                    <div id="painelAccordion" class="accordion-content">
                        <p>
                            
                        </p>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
